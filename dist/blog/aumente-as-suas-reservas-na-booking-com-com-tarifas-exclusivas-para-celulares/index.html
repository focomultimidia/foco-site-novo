    <title>Aumente as suas reservas na Booking.com com descontos exclusivos para celulares | Blog Foco</title>
    <meta name="description" content="Aumente as suas reservas na Booking.com através do celular do seu cliente! Essa dica é quente, amigo hoteleiro: tornar o seu hotel mais visível para clientes que reservam hospedagem pelo celular na Booking.com é uma estratégia fundamental para aumentar a taxa de ocupação de sua propriedade. Tudo isso porque esses valiosos viajantes têm comportamentos que os diferenciam dos demais, fato que justifica a investida de donos de hotéis e pousadas nesse perfil de consumidor. Olha só: De acordo com a Booking.com, clientes que usam o celular reservam 22% mais do que os demais! Veja só esse dado: 80% dos viajantes usam aplicativos móveis ao pesquisar uma hospedagem! Esses números reforçam a necessidade de hotéis e pousadas estarem conectados com esse perfil de usuário da plataforma, utilizando estratégias de tarifas atrativas para converter esses hóspedes. Não há como negar que o crescimento exponencial desse dispositivo mudou verdadeiramente o hábito de compra dos hóspedes. Vamos ver alguns números que ilustram essa nova onda de consumo pelos smartphones. Aumente as suas reservas na Booking.com: celular é o principal meio de acesso à internet no Brasil O Brasil tem atualmente mais de um smartphone por habitante, segundo levantamento anual divulgado pela FGV. São 242 milhões de celulares" />
    <link rel="icon" type="image/webp" href="/assets/imgs/logo/foco.webp" />

    <!-- Preload da General Sans Bold (peso 700) — é a fonte de TODO H1/título
         de hero do site (font-display font-bold), sempre acima da dobra. Sem
         isso, o navegador só DESCOBRE o arquivo depois de baixar e parsear
         index.css (o @font-face vive lá) — nesse intervalo o título já
         pintou com a fonte de fallback do sistema, e quando a General Sans
         chega e troca (`font-display: swap`, ver index.css), a métrica
         diferente de largura/altura da fonte real reflui o texto: um
         Cumulative Layout Shift medido (trace de performance) score ~0.3-0.4
         num elemento gigante de fundo (a aurora com `inset:-10%`, cujo
         tamanho é % da altura da section — qualquer reflow do título vira um
         reflow amplificado nela). Preload aqui faz o "preload scanner" do
         navegador começar o fetch já no parse bruto do HTML, bem antes do
         CSS ser processado — encolhe (idealmente elimina) a janela onde o
         texto pinta com a fonte errada antes de trocar. `crossorigin` é
         obrigatório em preload de fonte mesmo sendo same-origin (quirk do
         spec: toda fetch de fonte é modo CORS anônimo; sem o atributo aqui,
         o preload não bate com a fetch real do @font-face e é ignorado). -->
    <link rel="preload" href="/assets/fonts/general-sans/GeneralSans-700.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Preload das imagens do mockup da hero (LCP da home) — medido com
         trace de performance: sob throttling pesado, o elemento de LCP (a
         <img> do mockup, não o H1) só entra no DOM depois que o bundle JS
         baixa, faz parse e o React monta o componente — o "preload scanner"
         do navegador nunca vê essa URL no HTML bruto, então o pedido de
         rede só começa tarde. Como é uma SPA sem SSR/prerender por rota (um
         único index.html pra todas as rotas), um <link rel=preload>
         estático aqui preloadaria essa imagem em TODAS as páginas — por
         isso o script só injeta os links quando a rota atual é a home,
         rodando síncrono durante o parse do HTML (antes do bundle
         carregar), bem cedo o bastante pro navegador começar o fetch em
         paralelo com o JS.

         DUAS imagens, não uma: o mockup principal (dashboard.webp) é
         visualmente ~3x maior na tela, mas traces repetidos (produção e
         local) mostram o Chrome elegendo o mockup de celular flutuante
         (mapa-mobile.webp) como o elemento de LCP mesmo assim — provável
         artefato de timing da animação de entrada (Framer Motion) de cada
         mockup. Sem certeza de qual dos dois "vence" em qualquer viewport
         dado, preloada os dois — custo baixo (a segunda imagem já é
         pequena) contra a certeza de acertar o preload independente de
         qual é medido como LCP. -->
    <script>
    (function () {
      if (location.pathname === '/') {
        [
          '/assets/imgs/home/dashboard.webp',
          '/assets/imgs/home/produtos/mapa-mobile.webp'
        ].forEach(function (href) {
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'image';
          link.href = href;
          link.type = 'image/webp';
          link.fetchPriority = 'high';
          document.head.appendChild(link);
        });
      }
    })();
    </script>

    <!-- Google Tag Manager — carregamento adiado de propósito.
         Medido com trace de performance: o container GTM-ND5D5HX dispara
         mais de 30 tags de terceiros no carregamento (2 propriedades GA4,
         Universal Analytics legado, Facebook Pixel, LinkedIn Insight 2x,
         Bing Ads, vários pixels do Google Ads, Neurolead) — juntos, competem
         pela thread principal bem na janela crítica do LCP. Não dá pra podar
         tags daqui (isso mora na UI do GTM, não no código), então a saída é
         não competir com o carregamento crítico da página.

         Tentativa 1 (histórico): disparar no evento `load` — não resolveu,
         porque `load` também fica refém do mesmo congestionamento (sob
         throttling pesado, só dispara depois de ~19s).
         Tentativa 2 (histórico): `requestIdleCallback` — pior ainda: medido
         com trace sob throttling de 4x CPU, o GTM carregava praticamente
         JUNTO com o bundle principal (~1-2s), não depois de 5s como o
         `timeout` sugeria. Causa raiz: `requestIdleCallback` dispara em
         QUALQUER intervalo ocioso, e sob carga pesada a thread tem VÁRIOS
         intervalos curtos entre uma long task e outra — cada um já conta
         como "ocioso" o bastante pra disparar o callback, então na prática
         ele quase nunca espera o `timeout` de verdade.
         Tentativa 3 (atual): `setTimeout` puro — diferente de
         `requestIdleCallback`, `setTimeout` tem garantia de atraso MÍNIMO
         (só executa depois que o tempo do relógio passou, não aproveita
         brechas ociosas pra disparar cedo). Continua disparando também na
         primeira interação do usuário (scroll, clique, tecla, toque), o que
         vier primeiro. `dataLayer` já nasce pronto pra qualquer push futuro
         não se perder enquanto o GTM ainda não carregou. -->

        j.src = 'https://www.googletagmanager.com/gtm.js?id=' + GTM_ID;
        f.parentNode.insertBefore(j, f);
